# QPINO default configuration (all experiments read this file; CLI flags may override)
seed: 0

# DEFAULT model input: ONLY real Galerkin coefficients, one real coefficient per mode per qubit.
# Real cosine / Neumann (no-flux) basis u = sum_{k=0}^{M} b_k cos(k pi s / L), M = 8 -> 9 qubits.
# Runner: experiments/m4_experiments.py (reads this block).  The complex-Fourier (Re/Im)
# periodic and mirrored M=2/M=4 runs (synthetic_validation.py, covid_training.py, ablation
# scripts, and m4_experiments.py --boundary periodic|mirror) are the earlier complex-Fourier variant.
galerkin:
  basis: cosine        # cosine (default, real) | periodic | mirror (earlier complex-Fourier variant)
  M: 8
seeds: [0, 1, 2]
threads: 4

synthetic:
  D: 0.1
  rho: 1.0
  beta: 1.0
  dt: 0.1
  n_steps: 40          # T = 4
  N: 128               # reference grid (pseudo-spectral)
  n_train: 32
  n_val: 8
  n_test: 12
  data_seed: 123
  horizon: 5           # rollout-loss horizon H
  c0: 10.0             # tau = c * dt -> tau = 1 at the training dt

covid:
  raw_dir: data/raw
  fallback_dir: /workspace/covid_pinn/data   # local copy used only if the download fails
  n_bins: 32
  band_km: 100.0
  smooth_days: 7
  start: "2020-03-01"
  train_end: "2020-06-16"
  val_end: "2020-06-30"
  test_end: "2020-07-31"
  dt: 1.0              # days
  horizon: 7
  c0: 1.0

model:
  ansatz: hamiltonian
  graph: structured
  evolution: exact
  trotter_L: 4
  tau_mode: learned
  reupload: 1
  measure_zz: true
  decoder: linear
  alpha0: 1.0
  train_alpha: true
  init_scale: 0.5

mlp:
  hidden: 8
  depth: 2

train:
  epochs: 1500
  lr: 0.02
  batch_size: null     # full batch
  lambda_data: 1.0
  lambda_pde: 0.1
  lambda_roll: 0.5
  lambda_reg: 1.0
  reg_weights: {neg: 1.0, sat: 0.0, param: 1.0e-4, stab: 1.0}
  pde_target: full     # full | galerkin | both
  scheme: trapezoid    # forward | trapezoid | midpoint
  pde_ramp: [0.2, 0.6] # fraction of epochs: lambda_PDE ramps linearly from 0 to target
  log_every: 10
  clip: 10.0
