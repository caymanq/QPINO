# 2D contiguous-USA QPINO (report section 16).  Merged over default.yaml by experiments/usa2d_experiments.py.
grid_npz: /workspace/covid_pinn_hires/data/us_grid_density_256x128.npz   # copied to data/processed/ on first run
# u = log1p(cumulative cases per 100k) / log1p(4800), 256 x 128 cells (0.230 x 0.203 deg), land mask 17,609 cells
modes_per_axis: 3          # K: K*K real cosine coefficients b_kl = qubits (3 -> 9, 4 -> 16)
train_end: "2020-06-16"    # data start Mar 15 2020 (first day of the gridded field)
val_end: "2020-06-30"
test_end: "2020-07-26"     # last day of the gridded field; rollout from the observed Jun 30 state
dt: 1.0
horizon: 7
c0: 1.0
n_colloc: 400              # random land cells used as PDE collocation points
train:
  # Default from section 17 on: near-zero PDE weight (1e-4); the PDE residual is kept as a logged
  # physics-violation diagnostic (every epoch).  Section 16 runs used 0.01 (already effectively data-only).
  lambda_pde: 1.0e-4
  log_every: 1
  pde_hinge_tol: null      # optional hinge: penalise only |scaled residual| above this tolerance
rho_modes: 4               # spatial growth rate rho(x,y): Kr x Kr cosine modes (section 17)
rho_fit_windows: [28, 56, 0]                   # fit on the last NW training days (0 = whole window)
rho_lam_l2_grid: [0.0, 0.1, 1.0, 10.0, 100.0]  # shrinkage of non-constant rho modes towards uniform
rho_fit_iters: 200                             # (NW, lam_l2) chosen by the Jun 17-30 validation rollout
n_eval_points: 2000        # land cells for the PDE-residual (physics-violation) diagnostic
mlp_hidden: {9: 14, 16: 16}
